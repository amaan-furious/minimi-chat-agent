<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minimi — AI Research Agent</title>
  <meta name="description" content="A smart AI chat agent with real-time web search and persistent memory. Answers fast, remembers everything." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark">m</div>
        <span class="logo-text">minimi</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" title="New chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-label">Recent chats</div>
    <div class="sessions-list" id="sessionsList">
      <div class="sessions-loading">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="agent-badge">
        <div class="agent-dot"></div>
        <span>ReAct · Web Search · Memory</span>
      </div>
    </div>
  </aside>

  <!-- ── Main chat area ── -->
  <main class="main">
    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" id="sidebarToggle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-logo">
        <div class="pulse-ring"></div>
        <div class="logo-mark large">m</div>
      </div>
      <h1 class="empty-title">Ask me anything</h1>
      <p class="empty-subtitle">I search the web in real-time and remember our conversations.</p>
      <div class="suggestion-chips" id="suggestionChips">
        <button class="chip" data-query="What are the latest AI breakthroughs this week?">🔬 Latest AI breakthroughs</button>
        <button class="chip" data-query="What is the current price of Bitcoin?">₿ Bitcoin price now</button>
        <button class="chip" data-query="Summarise the top Hacker News stories today">📰 Top HN stories today</button>
        <button class="chip" data-query="What's the best Python web framework in 2025?">🐍 Best Python framework 2025</button>
      </div>
    </div>

    <!-- Messages container -->
    <div class="messages-container" id="messagesContainer" style="display:none">
      <div class="messages" id="messages"></div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Ask anything…"
          rows="1"
          maxlength="4000"
        ></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <div id="stopIcon" style="display:none" class="stop-icon"></div>
        </button>
      </div>
      <div class="input-footer">
        <span class="char-count" id="charCount">0 / 4000</span>
        <span class="model-badge">Gemini 1.5 Flash · ReAct</span>
      </div>
    </div>
  </main>

  <!-- ── Notification toast ── -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
